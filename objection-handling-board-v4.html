<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Objection handling — flow board</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background:#FAF9F5; color:#2C2C2A; overflow:hidden; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  header { flex:0 0 auto; background:#fff; border-bottom:1px solid #E4E1D6; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; z-index:20; }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header .sub { font-size:12px; color:#75736B; }
  .spacer { flex:1; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; }
  .lg { display:flex; align-items:center; gap:5px; font-size:11.5px; color:#5F5E5A; }
  .sw { width:11px; height:11px; border-radius:3px; border:1px solid; }
  button.ctl { font:inherit; font-size:12px; background:#fff; border:1px solid #D3D1C7; border-radius:6px; padding:5px 9px; cursor:pointer; color:#2C2C2A; }
  button.ctl:hover { background:#F1EFE8; }

  #jump { flex:0 0 auto; background:#fff; border-bottom:1px solid #E4E1D6; padding:7px 16px; display:flex; gap:6px; overflow-x:auto; white-space:nowrap; z-index:19; }
  #jump button { font:inherit; font-size:11.5px; background:#F5F3EC; border:1px solid #E4E1D6; border-radius:20px; padding:4px 11px; cursor:pointer; color:#44443F; flex:0 0 auto; }
  #jump button:hover { background:#EDE9DD; border-color:#C9C6B8; }

  #stage { flex:1 1 auto; position:relative; overflow:hidden; cursor:grab; background:#FAF9F5;
    background-image:radial-gradient(#DEDBCF 1px, transparent 1px); background-size:26px 26px; }
  #stage.drag { cursor:grabbing; }
  #canvas { position:absolute; top:0; left:0; transform-origin:0 0; }
  #edges { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }

  .lane { position:absolute; border-radius:16px; border:1px dashed #D8D5C7; background:rgba(255,255,255,0.5); }
  .lane.mine { border-color:#C9C6B8; background:rgba(243,241,234,0.75); }
  .lane-title { position:absolute; font-size:15px; font-weight:600; color:#44443F; letter-spacing:-0.01em; }
  .lane-kicker { position:absolute; font-size:11px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:#9C9A90; }

  .node { position:absolute; width:280px; border-radius:12px; border:1px solid; padding:11px 13px 12px; }
  .node .tag { font-size:9.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; opacity:.72; margin-bottom:5px; }
  .node .head { font-size:13.5px; font-weight:600; line-height:1.35; margin-bottom:5px; }
  .node .body { font-size:12.5px; line-height:1.5; }
  .node .body em { font-style:normal; opacity:.75; }
  .node ul { margin:5px 0 0; padding-left:15px; }
  .node li { font-size:12.5px; line-height:1.45; margin-bottom:2px; }
  .goto { display:inline-block; margin-top:8px; font:inherit; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.7); border:1px solid currentColor; border-radius:20px; padding:3px 10px; cursor:pointer; opacity:.85; }
  .goto:hover { opacity:1; }

  .t-obj  { background:#FAEEDA; border-color:#D99A2E; color:#412402; }
  .t-say  { background:#E9F2FB; border-color:#7FB0E4; color:#0B3B66; }
  .t-q    { background:#EEEDFE; border-color:#9A93E4; color:#26215C; }
  .t-win  { background:#EAF3DE; border-color:#97C459; color:#173404; }
  .t-brk  { background:#FAEAE7; border-color:#CE6B57; color:#4A1B10; border-width:2px; }
  .t-note { background:#F3F1EA; border-color:#CFCCC0; color:#33332F; }

  #hint { position:absolute; right:14px; bottom:14px; background:rgba(255,255,255,.94); border:1px solid #E4E1D6; border-radius:8px; padding:7px 11px; font-size:11.5px; color:#75736B; z-index:15; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Objection handling — flow board</h1>
      <div class="sub">Get specific. If nothing comes back, tie down. Both roads end at a real objection.</div>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:#FAEEDA;border-color:#D99A2E"></span>Prospect says</span>
      <span class="lg"><span class="sw" style="background:#E9F2FB;border-color:#7FB0E4"></span>Your line</span>
      <span class="lg"><span class="sw" style="background:#EEEDFE;border-color:#9A93E4"></span>Fork</span>
      <span class="lg"><span class="sw" style="background:#FAEAE7;border-color:#CE6B57"></span>Break</span>
      <span class="lg"><span class="sw" style="background:#EAF3DE;border-color:#97C459"></span>Outcome</span>
      <span class="lg"><span class="sw" style="background:#F3F1EA;border-color:#CFCCC0"></span>Coach note</span>
    </div>
    <button class="ctl" onclick="zoomBy(1.2)">+</button>
    <button class="ctl" onclick="zoomBy(1/1.2)">−</button>
    <button class="ctl" onclick="fitAll()">Fit</button>
  </header>
  <div id="jump"></div>
  <div id="stage">
    <div id="canvas"><svg id="edges"></svg></div>
    <div id="hint">Drag to pan · scroll to zoom</div>
  </div>
</div>

<script>
const LANES = [
  {id:'core', kicker:'The spine', name:'The pattern every lane below repeats', mine:true},
  {id:'think', kicker:'Objection 1', name:'"I need to think about it"'},
  {id:'research', kicker:'Objection 2', name:'"I need to do my research"'},
  {id:'dd', kicker:'Objection 3', name:'"I need to do my due diligence" / "I just found out about you guys"'},
  {id:'spouse', kicker:'Objection 4', name:'"I need to run it by my partner / spouse"'}
];

const N = [
// ---------- CORE ----------
{id:'c1', lane:'core', col:0, row:0, type:'obj', tag:'1. Objection', head:'Anything lands',
 body:'Take it at face value. No resistance, no pitch, no defending.'},
{id:'c2', lane:'core', col:1, row:0, type:'say', tag:'2. Get specific', head:'"Just so I can stay organised on my end — what specifically is keeping you from being less than 100% certain this is going to help you get more listings?"',
 body:'This is the only question that always gets asked. Everything after it depends on what comes back.'},
{id:'c3', lane:'core', col:2, row:0, type:'q', tag:'Fork', head:'What comes back?',
 body:'Specific → handle it.<br>Wishy-washy → tie down.'},
{id:'c4', lane:'core', col:3, row:1, type:'brk', tag:'2.2 — Specific', head:'They name a real objection',
 body:'<em>No tie-down needed.</em> You already have what the tie-down was designed to extract, so skip it entirely.'},
{id:'c5', lane:'core', col:4, row:1, type:'win', tag:'Then', head:'Handle it → back to the close'},
{id:'c6', lane:'core', col:3, row:0, type:'obj', tag:'2.1 — Wishy-washy', head:'Nothing specific comes back',
 body:'"I just need to think about it" / "nothing, I just want to look into it".'},
{id:'c7', lane:'core', col:4, row:0, type:'say', tag:'Tie down', head:'"So what I\'m basically understanding is you 100% think this will work, and you want to move forward after [their stall]?"',
 body:'Deliberately strong language. It is <em>not</em> built to get a yes — it\'s built to be broken.'},
{id:'c8', lane:'core', col:5, row:2, type:'brk', tag:'2.1.1 — It breaks', head:'They correct you with a real objection',
 body:'The tie-down worked. This lands you in exactly the same place as the branch above — you now have something specific.'},
{id:'c9', lane:'core', col:6, row:2, type:'win', tag:'Then', head:'Handle it → back to the close',
 body:'You never return to the original stall.'},
{id:'c10', lane:'core', col:5, row:0, type:'win', tag:'2.1.2 — It holds', head:'"So if you 100% think this will work and you want to do it — why don\'t we just get started now?"',
 body:'If they agree to the tie-down, the ask is the next thing out of your mouth. Don\'t let it drift back into conversation.'},
{id:'c11', lane:'core', col:6, row:1, type:'brk', tag:'Break on the ask', head:'They balk when you ask for the order',
 body:'<em>Not in your doc — my addition.</em> Whatever surfaces here is the last objection, usually price or authority. Handle it and ask again.'},
{id:'c12', lane:'core', col:7, row:0, type:'note', tag:'Read this once', head:'Every red card is a win',
 body:'Both branches of step 2 converge on the same thing: a real objection you can work with. The tie-down exists only to drag branch 2.1 over to where branch 2.2 already is.<br><br>The bad outcome is a tie-down that holds all the way through and still doesn\'t close — that means they agreed with you to end the conversation.'},
// ---------- THINK ----------
{id:'t1', lane:'think', col:0, row:0, type:'obj', tag:'Prospect', head:'"I need to think about it."'},
{id:'t2', lane:'think', col:1, row:0, type:'say', tag:'You', head:'"No problem at all. Just so I can stay organised on my end — what specifically is keeping you from being less than 100% certain that this is going to help you get more listings?"'},
{id:'t3', lane:'think', col:2, row:0, type:'q', tag:'Fork', head:'Which option?',
 body:'1 — Wishy-washy / "I just need to think about it"<br>2 — A specific concern'},
{id:'t4', lane:'think', col:3, row:1, type:'brk', tag:'Option 2 — specific', head:'They name a real concern',
 body:'No tie-down needed. Skip straight to handling it.'},
{id:'t5', lane:'think', col:4, row:1, type:'win', tag:'Then', head:'Handle it, then go back to the close'},
{id:'t6', lane:'think', col:3, row:0, type:'obj', tag:'Option 1', head:'Still wishy-washy',
 body:'"I just need to think about it."'},
{id:'t7', lane:'think', col:4, row:0, type:'say', tag:'Tie down', head:'"So what I\'m basically understanding is you 100% think this will work and want to move forward after you think about it a little?"',
 body:'<em>Strong definitive language on purpose. A yes here is unlikely — and that\'s the point.</em>'},
{id:'t7b', lane:'think', col:5, row:1, type:'brk', tag:'Break — most likely', head:'They break it and give you something specific',
 body:'Price, timing, a doubt about delivery, whatever it is. Handle that instead and go back to the ask.<br><br>You never have to return to "thinking about it".'},
{id:'t8', lane:'think', col:5, row:0, type:'say', tag:'It holds', head:'"So if you 100% think this will work and you want to do it — why don\'t we just get started with this now?"'},
{id:'t8b', lane:'think', col:6, row:1, type:'brk', tag:'Break on the ask', head:'They balk when you ask for the order',
 body:'The last objection is standing up. It\'s almost always price or authority. Handle it and ask again.'},
{id:'t9', lane:'think', col:6, row:0, type:'win', tag:'Outcome', head:'Close'},

// ---------- RESEARCH ----------
{id:'r1', lane:'research', col:0, row:0, type:'obj', tag:'Prospect', head:'"I need to do my research."'},
{id:'r2', lane:'research', col:1, row:0, type:'say', tag:'You', head:'"No problem at all, happy for you to do that. Just so I can stay organised on my end — what specifically is keeping you from being less than 100% certain that this is going to help you get more listings?"'},
{id:'r3', lane:'research', col:2, row:0, type:'q', tag:'Fork', head:'Specific, or still vague?'},
{id:'r4', lane:'research', col:3, row:1, type:'brk', tag:'Specific', head:'They name a real objection',
 body:'No tie-down needed. Handle it, side-step the research entirely, go back to the close.'},
{id:'r5', lane:'research', col:3, row:0, type:'obj', tag:'Still vague', head:'"Nothing — I just want to do more research."'},
{id:'r6', lane:'research', col:4, row:0, type:'say', tag:'Tie down', head:'"So what I\'m basically understanding is you 100% think this will work and want to move forward after you do some research?"',
 body:'<em>Strong definitive tie-down aimed at getting something specific. Unlikely they just say yes.</em>'},
{id:'r6b', lane:'research', col:5, row:1, type:'brk', tag:'Break — most likely', head:'They break it and name something real',
 body:'Handle the specific, side-step the research entirely, go back to the close.'},
{id:'r7', lane:'research', col:5, row:0, type:'say', tag:'It holds', head:'"That\'s good to hear. So when you say research — what were you hoping to specifically find more about?"'},
{id:'r8', lane:'research', col:6, row:0, type:'q', tag:'Fork', head:'What comes back?'},
{id:'r9', lane:'research', col:7, row:1, type:'obj', tag:'Most likely', head:'Pivots to a specific objection, or to due diligence',
 goto:'dd', gotoLabel:'Go to due diligence'},
{id:'r10', lane:'research', col:7, row:0, type:'obj', tag:'The other one', head:'"Nothing. Just perusing."',
 body:'You lost this call a long time ago. The only move left is to call it out.'},
{id:'r11', lane:'research', col:8, row:0, type:'say', tag:'Call-out', head:'"Can I be honest with you for a second?"',
 body:'"Earlier you said you were 100% certain this is going to help you, and that you want to move forward after you do some research. But when I ask what you specifically want to find out more about, you\'re saying nothing in particular.<br><br>So let me be clear. I\'m totally fine with either letting you do research, or with you not being interested in this at all. One of my core values is transparency and I just want to have an honest conversation. At this point I can\'t help but feel you\'re really just not that interested, and maybe you want to circle back in 6 months? Or what\'s really going on?"'},
{id:'r12', lane:'research', col:9, row:0, type:'note', tag:'Note', head:'Say it empathetically',
 body:'If your intention is truly just an honest conversation, this won\'t land as confrontational — and it shouldn\'t.<br><br>Two outcomes: they move on and you stop wasting time on a true tire kicker, or it prompts an honest conversation.'},

// ---------- DUE DILIGENCE ----------
{id:'d1', lane:'dd', col:0, row:0, type:'obj', tag:'Prospect', head:'"I need to do my due diligence" / "I just found out about you guys"'},
{id:'d2', lane:'dd', col:1, row:0, type:'say', tag:'Isolate', head:'"I totally get it, and no problem taking time to do some research on us. Just so I can be clear on my end — due diligence aside, do you feel like what we outlined is 100% what you need to get more listings?"'},
{id:'d3', lane:'dd', col:2, row:0, type:'q', tag:'Fork', head:'Clear yes, or unclear?'},
{id:'d4', lane:'dd', col:3, row:1, type:'say', tag:'Wishy-washy', head:'"So due diligence aside — what specifically is keeping you from being less than 100% certain this is what you need to get more listings?"'},
{id:'d5', lane:'dd', col:4, row:1, type:'win', tag:'Then', head:'Handle the specific, go back to the close'},
{id:'d6', lane:'dd', col:3, row:0, type:'obj', tag:'Clear yes', head:'"Yeah, it looks good!"'},
{id:'d7', lane:'dd', col:4, row:0, type:'say', tag:'Tie down hard', head:'"So basically, you\'re 100% ready to move forward — you just want to do some due diligence to make sure everything I told you on this call is 100% true and there are no red flags? And if so, we\'re good to go to move forward?"',
 body:'<em>Strong language on purpose. A lot of the time they\'ll hand you a deeper objection instead — that\'s the point of doing it.</em>'},
{id:'d7b', lane:'dd', col:5, row:1, type:'brk', tag:'Break — most likely', head:'A deeper objection surfaces',
 body:'This is exactly what the strong language was for. Handle it and side-step the due diligence branch entirely.'},
{id:'d8', lane:'dd', col:5, row:0, type:'say', tag:'It holds', head:'"No problem. I can probably help you speed up the research process. What specifically do you want to see — reviews? Case studies? Informational videos?"'},
{id:'d9', lane:'dd', col:6, row:0, type:'win', tag:'Best case', head:'"Do you mind if I walk you through one or two of those right now?"',
 body:'Defeat the objection on the spot with real-time proof, then close.'},
{id:'d10', lane:'dd', col:6, row:2, type:'note', tag:'The other case', head:'Some people need a day',
 body:'People who like to process things slowly. Send the material by email and set a next-day follow-up.<br><br><em>The doc says to use the sleep-on-it tie-down here to anchor the next-day frame — that script isn\'t in this version.</em>'},

// ---------- SPOUSE ----------
{id:'p1', lane:'spouse', col:0, row:0, type:'obj', tag:'Prospect', head:'"I need to run it by my partner / spouse."'},
{id:'p2', lane:'spouse', col:1, row:0, type:'say', tag:'Isolate', head:'"So aside from letting your spouse know — there isn\'t anything else keeping you from being less than 100% certain that this is what you want to do?"'},
{id:'p2b', lane:'spouse', col:2, row:1, type:'brk', tag:'Break', head:'Something else comes out',
 body:'Then the spouse was never the only thing. Handle what they just named before you go anywhere near the hypothetical.'},
{id:'p3', lane:'spouse', col:2, row:0, type:'say', tag:'Tie down', head:'"So just hypothetically — if your spouse was on this call and said \'Bob, I believe in you, you do whatever is best for us and your business\' — you\'d be 100% in?"'},
{id:'p3b', lane:'spouse', col:3, row:1, type:'brk', tag:'Break', head:'They hesitate on the hypothetical',
 body:'The spouse isn\'t the real blocker. Whatever the hesitation is protecting is the actual objection — handle that.'},
{id:'p4', lane:'spouse', col:3, row:0, type:'say', tag:'It holds — the key question', head:'"I totally get that and agree with you. Now just for clarity\'s sake —"',
 body:'<em>#1</em> Is this a respect thing, where no matter what you\'re going to do this regardless, you just want to let her know beforehand out of respect?<br><br><em>#2</em> Or do you need her permission to move forward — meaning it\'s not ultimately your sole decision to make?'},
{id:'p5', lane:'spouse', col:4, row:0, type:'q', tag:'Fork', head:'#1 or #2?'},
{id:'p6', lane:'spouse', col:5, row:0, type:'win', tag:'Definitive #1', head:'Closeable now — but rare',
 body:'No hesitation, purely a respect thing: take a refundable deposit, or get them to call the spouse immediately.'},
{id:'p7', lane:'spouse', col:5, row:1, type:'say', tag:'Anything else → discovery', head:'Two questions',
 body:'<ul><li>What specifically do you think they would be opposed to?</li><li>When do you think you can talk to your partner?</li></ul>'},
{id:'p8', lane:'spouse', col:6, row:1, type:'win', tag:'Outcome', head:'Schedule the follow-up with both of them on the line'}
];

const E = [
 ['c1','c2'],['c2','c3'],['c3','c4'],['c3','c6'],['c4','c5'],['c6','c7'],['c7','c8'],['c7','c10'],['c8','c9'],['c10','c11'],['c10','c12'],
 ['t1','t2'],['t2','t3'],['t3','t4'],['t3','t6'],['t4','t5'],['t6','t7'],['t7','t7b'],['t7','t8'],['t8','t8b'],['t8','t9'],
 ['r1','r2'],['r2','r3'],['r3','r4'],['r3','r5'],['r5','r6'],['r6','r6b'],['r6','r7'],['r7','r8'],['r8','r9'],['r8','r10'],['r10','r11'],['r11','r12'],
 ['d1','d2'],['d2','d3'],['d3','d4'],['d3','d6'],['d4','d5'],['d6','d7'],['d7','d7b'],['d7','d8'],['d8','d9'],['d8','d10'],
 ['p1','p2'],['p2','p2b'],['p2','p3'],['p3','p3b'],['p3','p4'],['p4','p5'],['p5','p6'],['p5','p7'],['p7','p8']
];

const COLW = 330, PADX = 26, LANE_GAP = 46, HEAD = 62, ROWGAP = 20, LANEPAD = 22;
const canvas = document.getElementById('canvas');
const svg = document.getElementById('edges');
const stage = document.getElementById('stage');
const laneY = {};
let W = 0, H = 0;

function esc(s){ return s || ''; }

function build(){
  const els = {};
  N.forEach(n => {
    const d = document.createElement('div');
    d.className = 'node t-' + n.type;
    d.id = 'n-' + n.id;
    let h = '';
    if (n.tag) h += '<div class="tag">' + esc(n.tag) + '</div>';
    if (n.head) h += '<div class="head">' + esc(n.head) + '</div>';
    if (n.body) h += '<div class="body">' + esc(n.body) + '</div>';
    if (n.goto) h += '<button class="goto" data-go="' + n.goto + '">' + esc(n.gotoLabel) + ' →</button>';
    d.innerHTML = h;
    canvas.appendChild(d);
    els[n.id] = d;
  });

  let y = 30;
  LANES.forEach(L => {
    const mine = N.filter(n => n.lane === L.id);
    const maxRow = Math.max(...mine.map(n => n.row));
    const rowH = [];
    for (let r = 0; r <= maxRow; r++) {
      const inRow = mine.filter(n => n.row === r).map(n => els[n.id].offsetHeight);
      rowH[r] = inRow.length ? Math.max(...inRow) : 40;
    }
    const bodyTop = y + HEAD;
    let acc = 0;
    const rowTop = [];
    for (let r = 0; r <= maxRow; r++) { rowTop[r] = bodyTop + acc; acc += rowH[r] + ROWGAP; }
    const laneH = HEAD + acc - ROWGAP + LANEPAD;
    const maxCol = Math.max(...mine.map(n => n.col));
    const laneW = PADX * 2 + (maxCol + 1) * COLW - (COLW - 280);

    const box = document.createElement('div');
    box.className = 'lane' + (L.mine ? ' mine' : '');
    box.style.cssText = `left:16px;top:${y}px;width:${laneW + 20}px;height:${laneH}px`;
    canvas.insertBefore(box, canvas.firstChild.nextSibling);

    const k = document.createElement('div');
    k.className = 'lane-kicker';
    k.style.cssText = `left:${16 + PADX}px;top:${y + 16}px`;
    k.textContent = L.kicker;
    canvas.appendChild(k);

    const t = document.createElement('div');
    t.className = 'lane-title';
    t.style.cssText = `left:${16 + PADX}px;top:${y + 32}px`;
    t.textContent = L.name;
    canvas.appendChild(t);

    laneY[L.id] = y;
    mine.forEach(n => {
      const el = els[n.id];
      el.style.left = (16 + PADX + n.col * COLW) + 'px';
      el.style.top = rowTop[n.row] + 'px';
      n._x = 16 + PADX + n.col * COLW;
      n._y = rowTop[n.row];
      n._w = 280;
      n._h = el.offsetHeight;
    });

    W = Math.max(W, laneW + 56);
    y += laneH + LANE_GAP;
  });
  H = y;

  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const map = {};
  N.forEach(n => map[n.id] = n);
  const BRK = new Set(N.filter(n => n.type === 'brk').map(n => n.id));
  let paths = '<defs>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B0ADA0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>' +
    '<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#CE6B57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>' +
    '</defs>';
  E.forEach(([a, b]) => {
    const A = map[a], B = map[b];
    if (!A || !B) return;
    const isBreak = BRK.has(b);
    let x1, y1, x2, y2, d;
    if (B._x > A._x) {
      x1 = A._x + A._w; y1 = A._y + Math.min(A._h / 2, 40);
      x2 = B._x - 8;    y2 = B._y + Math.min(B._h / 2, 40);
      const dx = Math.max(28, (x2 - x1) * 0.5);
      d = `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    } else {
      x1 = A._x + A._w / 2; y1 = A._y + A._h;
      x2 = B._x + B._w / 2; y2 = B._y - 8;
      d = `M${x1} ${y1} C${x1} ${y1 + 30}, ${x2} ${y2 - 30}, ${x2} ${y2}`;
    }
    const stroke = isBreak ? '#CE6B57' : '#B0ADA0';
    const wdt = isBreak ? 1.8 : 1.4;
    const mk = isBreak ? 'ar' : 'ah';
    const dash = isBreak ? ' stroke-dasharray="6 4"' : '';
    paths += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${wdt}"${dash} marker-end="url(#${mk})"/>`;
  });
  svg.innerHTML = paths;

  const jump = document.getElementById('jump');
  LANES.forEach(L => {
    const b = document.createElement('button');
    b.textContent = L.name.replace(/^"|"$/g, '').slice(0, 46);
    b.onclick = () => goLane(L.id);
    jump.appendChild(b);
  });
  document.querySelectorAll('.goto').forEach(b => b.onclick = () => goLane(b.dataset.go));
}

let tx = 0, ty = 0, sc = 1;
function apply(){ canvas.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; }
function goLane(id){
  const target = laneY[id];
  if (target == null) return;
  sc = Math.min(1, (stage.clientWidth - 40) / 1200);
  tx = 20; ty = -target * sc + 24; apply();
}
function zoomBy(f){
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
  const ns = Math.max(0.16, Math.min(2.2, sc * f));
  tx = cx - (cx - tx) * (ns / sc); ty = cy - (cy - ty) * (ns / sc); sc = ns; apply();
}
function fitAll(){
  sc = Math.max(0.16, Math.min((stage.clientWidth - 40) / W, (stage.clientHeight - 40) / H));
  tx = 20; ty = 20; apply();
}

let dragging = false, sx = 0, sy = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => { if (dragging) { tx = e.clientX - sx; ty = e.clientY - sy; apply(); } });
stage.addEventListener('pointerup', e => { dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.max(0.16, Math.min(2.2, sc * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  tx = mx - (mx - tx) * (ns / sc); ty = my - (my - ty) * (ns / sc); sc = ns; apply();
}, { passive: false });

build();
goLane('core');
</script>
</body>
</html>
